<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="t1 d1" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t1">Who owns what: main memory, aux bank 0, and one aux bank per process</title>
<desc id="d1">Three kinds of 64K block. Main memory holds the kernel and ProDOS 8. Aux bank 0 is the kernel annex and the only bank the video scanner reads. Every other aux bank is one process, with its own zero page, stack, program and a stub page at $FF00.</desc>
<rect x="0" y="0" width="680" height="400" fill="#ffffff"></rect>
<g fill="#111" font-size="13" font-weight="bold">
<text x="20" y="26">MAIN 64K</text>
<text x="250" y="26">AUX BANK 0</text>
<text x="470" y="26">AUX BANK 1, 2, 3 ...</text>
</g>
<g fill="#444" font-size="11">
<text x="20" y="42">the kernel and ProDOS 8</text>
<text x="250" y="42">the kernel annex</text>
<text x="470" y="42">one process each</text>
</g>
<g stroke="#111" stroke-width="2">
<rect x="20" y="52" width="210" height="320" fill="#e8eefc"></rect>
<rect x="250" y="52" width="200" height="320" fill="#fdf0d5"></rect>
<rect x="470" y="52" width="190" height="320" fill="#e4f4e4"></rect>
</g>
<g stroke="#111" stroke-width="1" fill="#ffffff">
<rect x="28" y="62" width="194" height="40"></rect>
<rect x="28" y="108" width="194" height="66"></rect>
<rect x="28" y="180" width="194" height="52"></rect>
<rect x="28" y="238" width="194" height="32"></rect>
<rect x="28" y="276" width="194" height="90"></rect>
<rect x="258" y="62" width="184" height="88"></rect>
<rect x="258" y="156" width="184" height="60"></rect>
<rect x="258" y="222" width="184" height="70"></rect>
<rect x="258" y="298" width="184" height="66" fill="#eeeeee" stroke-dasharray="4 3"></rect>
<rect x="478" y="62" width="174" height="40"></rect>
<rect x="478" y="108" width="174" height="40"></rect>
<rect x="478" y="154" width="174" height="110"></rect>
<rect x="478" y="270" width="174" height="40"></rect>
<rect x="478" y="316" width="174" height="48" fill="#ffe9c4"></rect>
</g>
<g fill="#111" font-size="11">
<text x="34" y="80">kernel zero page</text><text x="34" y="94">and stack</text>
<text x="34" y="126">kernel code: org $2000,</text><text x="34" y="140">up to about $97E8; it</text><text x="34" y="154">borrows the hires pages</text><text x="34" y="168">for itself</text>
<text x="34" y="198">text page 1 stays the</text><text x="34" y="212">display; ProDOS's $BF00</text><text x="34" y="226">global page is here</text>
<text x="34" y="254">$C000-$CFFF is not RAM:</text><text x="34" y="266">I/O and slot ROM</text>
<text x="34" y="292">language card: ProDOS 8's</text><text x="34" y="305">(MLI, drivers). maux's own</text><text x="34" y="318">use is bank 2: the bye</text><text x="34" y="331">resident at $D100 and the</text><text x="34" y="344">kernel cold segment at</text><text x="34" y="357">$D400. $FF00: ProDOS's page</text>
<text x="266" y="80">PCB array (one slot per</text><text x="266" y="94">process), cwd table,</text><text x="266" y="108">pipe rings, lazy-free</text><text x="266" y="122">tag pathnames</text>
<text x="266" y="174">alternate-screen stores,</text><text x="266" y="188">per-console foreground</text><text x="266" y="202">job table</text>
<text x="266" y="240">80-column text, aux half:</text><text x="266" y="254">the video scanner reads</text><text x="266" y="268">bank 0 and no other</text>
<text x="266" y="316">never scheduled as a</text><text x="266" y="330">process: its zero page</text><text x="266" y="344">and stack are unused</text>
<text x="486" y="82" font-size="12">own zero page</text><text x="486" y="96" font-size="10">($0000, via ALTZP)</text>
<text x="486" y="128" font-size="12">own stack</text><text x="486" y="142" font-size="10">($0100, via ALTZP)</text>
<text x="486" y="174" font-size="12">program and data</text><text x="486" y="190" font-size="12">$0200-$BFFF</text><text x="486" y="206" font-size="12">own language card</text><text x="486" y="222" font-size="12">view $D000-$FEFF</text><text x="486" y="238" font-size="10">no relocation: every</text><text x="486" y="252" font-size="10">process sees $0000 up</text>
<text x="486" y="288" font-size="12">$C000-$CFFF is</text><text x="486" y="302" font-size="10">never process memory</text>
<text x="486" y="334" font-size="12">$FF00-$FFFF: syscall</text><text x="486" y="350" font-size="12">and IRQ stubs</text>
</g>
<text x="20" y="392" fill="#444" font-size="11">Selected by one write to $C073 (RamWorks bank select; write-only).</text>
</svg>