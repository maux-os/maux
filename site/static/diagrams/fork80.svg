<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="t3 d3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t3">The 80STORE trap in a bank copy</title>
<desc id="d3">Left: fork copies a process bank into a new bank. Without the bracket, with 80STORE set, the copy of the text page window reads and writes main memory instead of the aux bank, so main is copied onto itself and the child never receives that window. Right: with the bracket, 80STORE is cleared for the copy and set again after, and the window arrives.</desc>
<rect x="0" y="0" width="680" height="330" fill="#ffffff"></rect>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"></path></marker></defs>
<g fill="#111" font-weight="bold" font-size="13">
<text x="20" y="26">Unbracketed copy of $2000-$3FFF</text>
<text x="360" y="26">With CLR80STORE ... SET80STORE</text>
</g>
<g stroke="#111" stroke-width="2">
<rect x="20" y="44" width="130" height="100" fill="#e4f4e4"></rect>
<rect x="190" y="44" width="130" height="100" fill="#e4f4e4"></rect>
<rect x="20" y="170" width="130" height="100" fill="#e8eefc"></rect>
<rect x="360" y="44" width="130" height="100" fill="#e4f4e4"></rect>
<rect x="530" y="44" width="130" height="100" fill="#e4f4e4"></rect>
</g>
<g fill="#111">
<text x="28" y="64">parent bank</text><text x="28" y="84" font-size="11">window holds the</text><text x="28" y="98" font-size="11">program's data</text>
<text x="198" y="64">child bank</text><text x="198" y="84" font-size="11">window stays</text><text x="198" y="98" font-size="11">empty: it never</text><text x="198" y="112" font-size="11">arrives</text>
<text x="28" y="190">main memory</text><text x="28" y="210" font-size="11">read AND written:</text><text x="28" y="224" font-size="11">copied onto itself,</text><text x="28" y="238" font-size="11">silently</text>
<text x="368" y="64">parent bank</text><text x="368" y="84" font-size="11">window holds the</text><text x="368" y="98" font-size="11">program's data</text>
<text x="538" y="64">child bank</text><text x="538" y="84" font-size="11">window arrives,</text><text x="538" y="98" font-size="11">byte for byte</text>
</g>
<g stroke="#111" stroke-width="2" fill="none">
<path d="M150 94 L188 94" stroke-dasharray="5 4" stroke="#999999"></path>
<path d="M85 144 L85 168" marker-end="url(#b)"></path>
<path d="M490 94 L528 94" marker-end="url(#b)"></path>
</g>
<g fill="#111" font-size="12">
<text x="20" y="298">With 80STORE set, RAMRD and RAMWRT are ignored for $0400-$07FF</text>
<text x="20" y="314">and (with HIRES) $2000-$3FFF; PAGE2 alone routes them. No crash, no log.</text>
<text x="360" y="200" font-size="11">The gate, check-fork, forks with 80STORE</text>
<text x="360" y="214" font-size="11">and HIRES both set, because with the</text>
<text x="360" y="228" font-size="11">switches off it passes with the bracket</text>
<text x="360" y="242" font-size="11">deleted. The documentation already says</text>
<text x="360" y="256" font-size="11">so; the first fork design, reasoned</text>
<text x="360" y="270" font-size="11">from first principles, missed it.</text>
</g>
</svg>