<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="t4 d4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t4">bye: suspend maux, run a ProDOS program, come back</title>
<desc id="d4">Three stages left to right. Before: maux is running. During: main memory and the annex are saved into two RamWorks banks that plain ProDOS cannot see, a small resident sits at $D100 in language card bank 2, /RAM is reinstalled empty, and a ProDOS 8 program runs on what looks like a freshly booted machine. After: the program calls QUIT, ProDOS copies the window at $D100 to $1000 and jumps there, and the resident copies the saved state back, removes /RAM again and resumes the scheduler. The program's own outcome is not passed back.</desc>
<rect x="0" y="0" width="680" height="340" fill="#ffffff"></rect>
<defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"></path></marker></defs>
<g stroke="#111" stroke-width="2">
<rect x="10" y="20" width="200" height="270" fill="#e4f4e4"></rect>
<rect x="240" y="20" width="200" height="270" fill="#fdf0d5"></rect>
<rect x="470" y="20" width="200" height="270" fill="#e4f4e4"></rect>
</g>
<g fill="#111" font-weight="bold" font-size="13">
<text x="20" y="42">1. maux is running</text>
<text x="250" y="42">2. bye</text>
<text x="480" y="42">3. the program QUITs</text>
</g>
<g fill="#111" font-size="11">
<text x="20" y="68">Your shell types:</text><text x="20" y="84">  bye MYPROG.SYSTEM</text>
<text x="20" y="112">Processes sit in their</text><text x="20" y="126">own banks, which ProDOS</text><text x="20" y="140">does not know exist.</text>
<text x="20" y="168">Open files are closed</text><text x="20" y="182">and remembered; the tick</text><text x="20" y="196">is quiesced and the</text><text x="20" y="210">console released.</text>
<text x="250" y="68">Main memory and the annex</text><text x="250" y="82">are saved into TWO banks</text><text x="250" y="96">plain ProDOS cannot see.</text>
<text x="250" y="122">A resident is put at</text><text x="250" y="136">$D100-$D3FF, ProDOS's</text><text x="250" y="150">QUIT window.</text>
<text x="250" y="176">/RAM is reinstalled, empty,</text><text x="250" y="190">as ProDOS made it.</text>
<text x="250" y="216">MYPROG.SYSTEM loads at</text><text x="250" y="230">$2000 and runs on a</text><text x="250" y="244">machine that looks</text><text x="250" y="258">freshly booted.</text>
<text x="480" y="68">QUIT is MLI call $65: it</text><text x="480" y="82">copies $D100-$D3FF to</text><text x="480" y="96">$1000 and jumps there.</text><text x="480" y="110">That is the resident.</text>
<text x="480" y="136">It removes /RAM again,</text><text x="480" y="150">copies the saved state</text><text x="480" y="164">back, restores the soft</text><text x="480" y="178">switches and the language</text><text x="480" y="192">card, and re-arms the tick.</text>
<text x="480" y="218">The shell returns from</text><text x="480" y="232">bye: &#34;Welcome back.&#34;</text><text x="480" y="252">The program's own outcome</text><text x="480" y="266">is not passed back.</text>
</g>
<g stroke="#111" stroke-width="2" fill="none" marker-end="url(#c)">
<path d="M210 145 L238 145"></path>
<path d="M440 145 L468 145"></path>
</g>
<text x="10" y="312" fill="#111" font-size="12">The program under test can be one you just built with nas and ld, run on ProDOS 8 itself.</text>
<text x="10" y="328" fill="#444" font-size="11">Mechanism: docs/BYE.md (2026-09-26 and 2026-09-27 rulings). Gates: check-bye, check-tenant.</text>
</svg>