<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="t2 d2" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t2">A context switch, step by step</title>
<desc id="d2">A process takes a syscall or interrupt. Its own $FFxx page pushes a six byte frame on its own stack and switches reads and writes to main memory. The kernel then switches the zero page and stack to main, picks the next process, writes the new bank number to $C073, switches the zero page and stack back to aux, and returns with RTI.</desc>
<rect x="0" y="0" width="680" height="360" fill="#ffffff"></rect>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"></path></marker></defs>
<g stroke="#111" stroke-width="2" fill="#e4f4e4">
<rect x="20" y="20" width="200" height="150"></rect>
<rect x="20" y="190" width="200" height="150"></rect>
</g>
<rect x="260" y="20" width="400" height="320" fill="#e8eefc" stroke="#111" stroke-width="2"></rect>
<g fill="#111" font-weight="bold" font-size="13">
<text x="30" y="40">process A (bank 3)</text>
<text x="30" y="210">process B (bank 5)</text>
<text x="270" y="40">the kernel (main memory)</text>
</g>
<g fill="#111">
<text x="30" y="64">1. JSR $FF00 or IRQ</text>
<text x="30" y="84" font-size="11">2. the call or IRQ already</text><text x="30" y="98" font-size="11">   pushed PC (and P, for an</text><text x="30" y="112" font-size="11">   IRQ); its $FFxx stub pushes</text><text x="30" y="126" font-size="11">   P (syscall door) and A,X,Y</text><text x="30" y="140" font-size="11">   on ITS stack</text><text x="30" y="160" font-size="11">3. RAMRD/RAMWRT -&gt; main</text>
<text x="30" y="234">9. exit tail: RAMRD/</text><text x="30" y="250">   RAMWRT -&gt; aux,</text>
<text x="30" y="266">   restore A,X,Y</text><text x="30" y="282">10. RTI: B runs on,</text><text x="30" y="298">   B's PC, B's stack</text>
<text x="270" y="64">4. TSX (A's SP); ALTZP -&gt; main:</text><text x="270" y="80">   zero page and stack are now</text><text x="270" y="96">   the kernel's own</text>
<text x="270" y="124">5. load kernel SP; serve the call</text><text x="270" y="140">   or the tick; choose next = B</text>
<text x="270" y="168">6. save A's SP in its PCB</text>
<text x="270" y="196">7. write 5 to $C073   &lt;-- the switch</text>
<text x="270" y="224">8. ALTZP -&gt; aux, then TXS from B's</text><text x="270" y="240">   saved SP (no push in between:</text><text x="270" y="256">   page 1 is now B's stack)</text>
<text x="270" y="290">Registers, zero page, stack and the</text><text x="270" y="306">address space all change with one</text><text x="270" y="322">bank number and a few soft switches.</text>
</g>
<g stroke="#111" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M220 100 L258 100"></path>
<path d="M258 250 L222 250"></path>
</g>
</svg>