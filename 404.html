<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maux</title>

<meta http-equiv="refresh" content="0; url=https://maux-os.github.io/">
<style>
html { color-scheme: dark; }
body { margin: 0; padding: 3rem 1rem; background: #14130f; color: #ece8da;
  font: 1.125rem/1.6 "Spectral", Georgia, serif; text-align: center; }
a { color: #f0b45a; }
</style>
<script>
/* carry the path across: /maux/get/ here means /get/ there. The refresh
   above is the no-script answer and lands on the front page. */
(function () {
  var p = location.pathname.replace(/^\/maux(?=\/|$)/, '');
  location.replace('https://maux-os.github.io' + (p === '' ? '/' : p) +
                   location.search + location.hash);
}());
</script>
</head>
<body>
<p>The maux site is at <a href="https://maux-os.github.io/">maux-os.github.io</a>.</p>
</body>
</html>
